# Theme: Coolnight-Auto

font_family Monospace
font_size 18

background_image ~/dotfiles/assets/David-The-Death-of-Socrates.png
background_image_layout scaled
background_opacity 0.5
dynamic_background_opacity yes
background_tint 0.8
# background_opacity 0.7
background #010b17
foreground #ebddf4

cursor #38ff9c

color0  #0b3b61
color1  #ff3a3a
color2  #52ffcf
color3  #fff383
color4  #1376f8
color5  #c792ea
color6  #ff5dd4
color7  #15fca2
color8  #62686c
color9  #ff54b0
color10 #73ffd8
color11 #fcf4ad
color12 #378dfe
color13 #ae81ff
color14 #ff69d7
color15 #5ffbbe

enable_audio_bell no
shell zsh
hide_window_decorations no
